name: Delete merged PR branch

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: delete-branch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  delete:
    # Only a merged PR, and only a branch in this repository: closing a PR
    # without merging keeps its work, and a fork's branch is not ours to delete.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Nothing is checked out. Deleting a ref needs no working tree, and the
      # tag a merged release PR creates points at the merge commit on main,
      # which this deletion cannot reach.
      - name: Delete the merged head branch
        env:
          GH_TOKEN: ${{ github.token }}
          # A branch name is user input, so it reaches the script as data.
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "Refusing to delete the default branch $BRANCH."
            exit 0
          fi
          if gh api --silent -X DELETE "repos/$REPOSITORY/git/refs/heads/$BRANCH"; then
            echo "Deleted $BRANCH."
          else
            # Already deleted by hand, or protected: neither is a failed run,
            # and neither costs anything that a merged branch still holds.
            echo "Did not delete $BRANCH; it may already have been removed."
          fi
