version: 2
# Use the default branch (main) so PR customization also covers security updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: Fix
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1
    commit-message:
      prefix: Fix
    groups:
      github-actions:
        patterns: ["*"]
